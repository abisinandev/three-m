name: CI Pipeline

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["dev"]

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install Backend Dependencies
        working-directory: server
        run: npm install

      - name: Lint Backend
        working-directory: server
        run: npm run lint

      - name: Build Backend
        working-directory: server
        run: npm run build


  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: client
        run: npm install

      - name: Lint Frontend
        working-directory: client
        run: npm run lint

      - name: Build Frontend
        working-directory: client
        run: npm run build
cd 