name: CI Pipeline

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["dev"]       # run CI when dev branch is pushed

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # BACKEND
      - name: Install Backend Dependencies
        run: |
          cd server
          npm install

      - name: Backend Build
        run: |
          cd server
          npm run build

      - name: Backend Test
        run: |
          cd server
          npm test

      # FRONTEND
      - name: Install Frontend Dependencies
        run: |
          cd client
          npm install

      - name: Frontend Build
        run: |
          cd client
          npm run build

      - name: Frontend Test
        run: |
          cd client
          npm test
