name: CI/CD Pipeline

on:
  pull_request:
    branches: ["master"]
  push:
    branches: ["master", "dev"]

jobs:
  # ==================== CI JOBS ====================
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install Backend Dependencies
        working-directory: server
        run: npm ci --legacy-peer-deps

      - name: Lint Backend
        working-directory: server
        run: npm run lint

      - name: Build Backend
        working-directory: server
        run: npm run build

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    needs: backend-ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: client
        run: npm ci

      - name: Build Frontend
        working-directory: client
        run: npm run build

  # ==================== CD JOBS ====================
  backend-cd:
    name: Backend CD (EC2)
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev') && github.event_name == 'push'
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image
        working-directory: server
        run: |
          docker build -t backend-app:${{ github.sha }} .
          docker save backend-app:${{ github.sha }} | gzip > backend-app.tar.gz

      - name: Copy to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          source: "server/backend-app.tar.gz"
          target: "~/app"
          strip_components: 1

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          script: |
            cd ~/app
            
            # Load new image
            docker load < backend-app.tar.gz
            
            # Stop and remove old container
            docker stop backend-api || true
            docker rm backend-api || true
            
            # Run new container
            docker run -d \
              --name backend-api \
              --restart unless-stopped \
              -p 9000:9000 \
              -e NODE_ENV=production \
              --env-file .env \
              backend-app:${{ github.sha }}
            
            # Cleanup
            docker system prune -f
            rm -f backend-app.tar.gz
            
            # Verify
            sleep 5
            docker ps | grep backend-api
